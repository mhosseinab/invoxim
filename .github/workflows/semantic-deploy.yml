name: Semantic deploy to Cloudflare
run-name: Semantic deploy ${{ github.ref_name }}
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
permissions:
  contents: read
# One production deployment at a time; never cancel an in-flight deploy.
concurrency:
  group: semantic-deploy-cloudflare
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Required reviewers on this environment are the approval gate; it also
    # holds the Cloudflare secrets. Resource names live in apps/*/wrangler.jsonc.
    environment: production
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse history not reviewed into main
        run: git merge-base --is-ancestor HEAD origin/main || { echo "::error::$GITHUB_SHA is not reachable from main."; exit 1; }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@12.6.0 --ignore-scripts
      # Only pnpm's reviewed native bootstrap runs; workspace scripts stay blocked.
      - run: node "$(npm root --global)/pnpm/install.js"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      # Read-only and non-blocking: applying migrations stays a manual operator step.
      - name: Report pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @invoxim/worker exec wrangler d1 migrations list DB --remote || echo "::warning::D1 migration status unavailable."
      # Worker first: the Pages frontend binds to it.
      - name: Deploy the API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @invoxim/worker exec wrangler deploy
      # `main` must be the Pages project's production branch, or this lands in preview.
      - name: Deploy the Pages frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @invoxim/web exec wrangler pages deploy --branch main
